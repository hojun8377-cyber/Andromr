name: Android piano player build

on:
  push:
    branches:
      - feature/piano-player-foundation
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/piano-player-foundation

      - name: Test MusicXML parser and MIDI writer
        run: python3 -m unittest pytests.test_piano_musicxml_midi

      - name: Install SoundFont archive tools
        run: |
          sudo apt-get update
          sudo apt-get install -y p7zip-full

      - name: Fetch CC0 piano SoundFont
        run: bash scripts/fetch_piano_soundfont.sh

      - name: Build Android debug APK
        run: |
          mkdir -p "$HOME/.buildozer"
          docker pull kivy/buildozer
          docker run --rm --entrypoint /bin/bash -e PIP_EXTRA_INDEX_URL=https://www.piwheels.org/simple -v "$HOME/.buildozer:/home/user/.buildozer" -v "$PWD:/home/user/hostcwd" -w /home/user/hostcwd kivy/buildozer -lc 'set -o pipefail; buildozer android debug || true; python scripts/patch_build_templates.py; SDKMANAGER=$(find /root/.buildozer/android/platform -type f -name sdkmanager 2>/dev/null | head -n 1); if [ -n "$SDKMANAGER" ]; then yes | "$SDKMANAGER" --licenses || true; fi; buildozer android debug'

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: andromr-piano-debug-apk
          path: bin/*.apk
          if-no-files-found: error
          retention-days: 14
